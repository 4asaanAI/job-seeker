# --- Employers chosen from seekers' resumes (live-tested 2026-09-19) ------
# Lever and Ashby boards are crawled by Wigolo through scripts/wigolo_jobs.py.
# {python} and {home} are expanded by JobPilot at run time.
[wigolo_sources.palantir]
company_name = "Palantir"
endpoint = "https://jobs.lever.co/palantir"
command = ["{python}", "{home}/scripts/wigolo_jobs.py"]
canary_term = "manager"
enabled = true
fetch_timeout_seconds = 180.0

[wigolo_sources.ramp]
company_name = "Ramp"
endpoint = "https://jobs.ashbyhq.com/ramp"
command = ["{python}", "{home}/scripts/wigolo_jobs.py"]
canary_term = "manager"
enabled = true
fetch_timeout_seconds = 180.0

[wigolo_sources.notion]
company_name = "Notion"
endpoint = "https://jobs.ashbyhq.com/notion"
command = ["{python}", "{home}/scripts/wigolo_jobs.py"]
canary_term = "manager"
enabled = true
fetch_timeout_seconds = 180.0

