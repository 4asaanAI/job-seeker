[paths]
data_dir = "data"
out_dir = "out"

[limits]
score_batch = 40
min_request_gap_seconds = 4.0

[scoring]
# Batch job scoring runs on a cheap model: the Telegram bot shares the same
# Claude subscription limit. Aliases: haiku | sonnet | opus.
model = "haiku"

# ---- Official employer ATS JSON (R4) ----
# Add one block per verified public JSON endpoint, then add the same source key
# to the seeker's profile. Keep these disabled until the endpoint has been
# checked against its employer careers page. JobPilot never guesses endpoints
# from a careers URL and never accepts an endpoint from a seeker message.
#
# [ats_sources.example_greenhouse]
# vendor = "greenhouse" # greenhouse | lever | workday | successfactors
# company_name = "Example employer"
# endpoint = "https://boards.greenhouse.io/example/jobs.json"
# enabled = false
# canary_min_results = 1
# fetch_timeout_seconds = 20.0

# Separate-process Wigolo wrapper (R4). JobPilot never imports or bundles
# Wigolo. The command must print the documented JSON contract to stdout.
#
# [wigolo_sources.example_careers]
# company_name = "Example employer"
# endpoint = "https://careers.example.test/jobs"
# command = ["wigolo-wrapper"]
# canary_term = "business analyst"
# canary_location = "Austin"
# enabled = false
# canary_min_results = 1
# fetch_timeout_seconds = 30.0

# Ordinary career page with JobPosting JSON-LD (Layer 2). This is deliberately
# separate from ATS JSON: the endpoint is an HTML page, not a guessed API.
#
# [structured_sources.example_careers]
# company_name = "Example employer"
# endpoint = "https://careers.example.test/jobs"
# enabled = false
# canary_min_results = 1
# fetch_timeout_seconds = 20.0

# ---- India ----
# Off: Naukri answers every automated request with HTTP 406 "recaptcha
# required" (verified live 2026-09-22). No official feed exists.
[sites.naukri_in]
site = "naukri"
enabled = false
country_indeed = "india"
hours_old = 168
results_wanted = 50
fetch_descriptions = true

[sites.naukri_in.canary]
search_term = "manager"
results_wanted = 20
min_results = 10

# Foundit (formerly Monster India): its public search API is allowed by
# robots.txt and returns full descriptions. Paced: 3 pages max, 2 s apart.
[ats_sources.foundit_in]
vendor = "foundit"
company_name = "Foundit"
endpoint = "https://www.foundit.in/home/api/searchResultsPage"
enabled = true
canary_min_results = 5
fetch_timeout_seconds = 30.0

