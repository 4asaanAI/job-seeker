# --- Two more ATS connectors ported from career-ops (MIT-licensed reference,
# https://github.com/career-ops-hq/career-ops), each live-tested against a
# real tenant before being enabled 2026-09-20. Not yet subscribed by any
# seeker; enable per-employer once a target company on one of these is named.
[ats_sources.example_bamboohr]
vendor = "bamboohr"
company_name = "Proscia"
endpoint = "https://proscia.bamboohr.com/careers/list"
enabled = false

[ats_sources.example_breezy]
vendor = "breezy"
company_name = "Embraer"
endpoint = "https://embraer.breezy.hr/json"
enabled = false

# Chosen for Sam (2026-09-21): searched Breezy/BambooHR tenants against his
# exact search terms and exclude_keywords, both US-based with real current
# openings that clear his filters. Others found and rejected: continued.com
# and hungerrush.com only had "Senior Product Manager" (excluded by his own
# "senior" keyword); betterme.com and sbc-performance.com only matched in
# Ukraine, not a fit for someone who needs US visa sponsorship;
# startupblink.com's one match was an unanchored "Worldwide" remote role at a
# very small company, an unlikely sponsor. No BambooHR tenant matched him.
[ats_sources.mae_health]
vendor = "breezy"
company_name = "Mae"
endpoint = "https://mae-health.breezy.hr/json"
enabled = true

[ats_sources.nuview]
vendor = "breezy"
company_name = "NuView"
endpoint = "https://nuview.breezy.hr/json"
enabled = true
