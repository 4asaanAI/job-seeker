[project]
name = "jobpilot"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-jobspy @ git+https://github.com/speedyapply/JobSpy@fda080a373e8226f3fd60635323f5da9af9892b1",
    "fastmcp>=4.0,<4.1",
    "PyYAML>=6.0,<7.0",
    "Jinja2>=3.1,<4.0",
    "python-docx>=1.1,<2.0",
    "pypdf>=5.0,<6.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
sheets = ["google-api-python-client>=2.0,<3.0", "google-auth>=2.0,<3.0"]
# Amazon Bedrock brain ([llm] provider = "bedrock")
aws = ["boto3>=1.35,<2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobpilot = ["store/*.sql", "dashboard/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
