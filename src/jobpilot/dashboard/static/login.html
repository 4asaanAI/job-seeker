<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobPilot</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#1f3a5f">
<style>
  :root { --bg: #f5f6f8; --card: #fff; --ink: #1d2433; --muted: #5d6779; --accent: #1f3a5f; --line: #dde2ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --card: #1a202b; --ink: #e8ecf2; --muted: #9aa5b6; --accent: #7fb0ee; --line: #2b3342; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: min(360px, 88vw); }
  h1 { margin: 0 0 4px; font-size: 22px; } p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
          background: var(--bg); color: var(--ink); font-size: 16px; }
  button { margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent);
           color: #fff; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>JobPilot</h1>
  <p>Enter your dashboard token (from <code>python -m jobpilot.dashboard --new-token</code>).</p>
  <label for="token" hidden>Token</label>
  <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Log in</button>
</form>
</body>
</html>
